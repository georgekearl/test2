<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Planner</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<!-- Firebase - used for live cross-device sync of fridge contents and
     shopping-list selections. Recipes/ingredients/steps still come from
     the static data/*.json files fetched below. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
  :root {
    --bg: rgb(24,26,38); --tile: rgb(38,41,58); --tile-hi: rgb(50,54,76);
    --text: rgb(235,236,244); --muted: rgb(150,155,175);
    --green: rgb(87,187,138); --amber: rgb(240,173,78); --red: rgb(224,90,90);
    --accent: rgb(99,148,255); --border: rgb(70,74,96);
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:18px; background:#0d0e15; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; display:flex; justify-content:center; }
  .screen { width:100%; max-width:980px; background:var(--bg); border-radius:14px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,0.5); min-height:70vh; }
  .header { display:flex; justify-content:space-between; align-items:center; padding-bottom:14px; margin-bottom:18px; border-bottom:1px solid rgba(255,255,255,0.06); gap:12px; flex-wrap:wrap; }
  .header h1 { margin:0; font-size:clamp(18px,3.6vw,26px); font-weight:700; color:var(--text); cursor:pointer; }
  .header-right { display:flex; align-items:center; gap:10px; }
  .back { color:var(--accent); font-size:14px; cursor:pointer; font-weight:600; white-space:nowrap; }
  .lang-toggle { font-size:19px; cursor:pointer; padding:3px 9px; border-radius:8px; background:var(--tile); border:1px solid var(--border); line-height:1.4; }
  .lang-toggle:hover { background:var(--tile-hi); }

  .kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
  @media (max-width:620px){ .kpi-row{grid-template-columns:repeat(2,1fr);} .main-row{grid-template-columns:1fr !important;} }
  .kpi { background:var(--tile); border-radius:10px; padding:14px 16px; cursor:pointer; transition:background 0.15s; }
  .kpi:hover { background:var(--tile-hi); }
  .kpi-label { font-size:10px; font-weight:700; letter-spacing:.6px; color:var(--muted); text-transform:uppercase; }
  .kpi-value { font-size:clamp(24px,5vw,32px); font-weight:700; color:var(--text); margin-top:6px; }
  .kpi-value.good{color:var(--green);} .kpi-value.warn{color:var(--amber);}

  .main-row { display:grid; grid-template-columns:1.08fr 1fr; gap:14px; margin-bottom:14px; }
  .tile { background:var(--tile); border-radius:10px; padding:16px; }
  .tile-hdr { font-size:11px; font-weight:700; letter-spacing:.6px; color:var(--muted); text-transform:uppercase; margin-bottom:12px; }

  .sugg-line { display:flex; align-items:flex-start; gap:10px; padding:9px 6px; border-radius:7px; font-size:14px; color:var(--text); border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; user-select:none; }
  .sugg-line:hover { background:rgba(255,255,255,0.03); }
  .sugg-line.selected { background:rgba(99,148,255,0.12); }
  .check { flex:0 0 auto; width:16px; height:16px; margin-top:2px; border-radius:4px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; color:transparent; }
  .sugg-line.selected .check { background:var(--accent); border-color:var(--accent); color:rgb(20,24,40); }
  .check.checked { background:var(--accent); border-color:var(--accent); color:rgb(20,24,40); }
  .dot { flex:0 0 auto; width:9px; height:9px; border-radius:50%; margin-top:5px; }
  .dot.green{background:var(--green);} .dot.amber{background:var(--amber);} .dot.red{background:var(--red);}
  .sugg-missing { color:var(--muted); font-size:12.5px; }
  .recipe-title { cursor:pointer; text-decoration:underline; text-decoration-color:rgba(255,255,255,0.25); }
  .recipe-title:hover { color:var(--accent); }

  .right-col { display:flex; flex-direction:column; gap:14px; }
  .shop-item { display:flex; justify-content:space-between; font-size:13.5px; color:var(--text); padding:5px 0; }
  .shop-item .qty { color:var(--muted); }
  .empty-msg { color:var(--muted); font-size:13px; font-style:italic; }

  .btn-row { display:flex; gap:12px; flex-wrap:wrap; }
  .btn { flex:1 1 140px; text-align:center; padding:11px 10px; border-radius:8px; font-size:13px; font-weight:700; color:var(--text); border:1px solid var(--border); background:var(--tile); cursor:pointer; }
  .btn:hover { background:var(--tile-hi); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:rgb(20,24,40); }

  .hero-img { width:100%; border-radius:10px; margin-bottom:16px; display:block; object-fit:cover; max-height:340px; }
  .recipe-meta { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .ing-list { list-style:none; padding:0; margin:0 0 20px; }
  .ing-list li { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.05); color:var(--text); font-size:14px; }
  .ing-list li .qty { color:var(--muted); }

  .recipe-card { display:flex; gap:14px; background:var(--tile); border-radius:10px; padding:14px; margin-bottom:12px; cursor:pointer; }
  .recipe-card:hover { background:var(--tile-hi); }
  .recipe-card-img { width:96px; height:96px; object-fit:cover; border-radius:8px; flex:0 0 auto; }
  .recipe-card-body { flex:1; min-width:0; }
  .recipe-card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .recipe-card-title { font-size:15px; font-weight:700; color:var(--text); text-decoration:underline; text-decoration-color:rgba(255,255,255,0.25); }
  .recipe-card-meta { color:var(--muted); font-size:12.5px; margin-top:6px; display:flex; align-items:center; gap:6px; }

  .cook-step-img { width:100%; max-height:320px; object-fit:cover; border-radius:10px; margin-bottom:16px; }
  .cook-progress { color:var(--muted); font-size:12px; text-align:center; margin-bottom:8px; letter-spacing:.5px; text-transform:uppercase; }
  .cook-title { font-size:20px; font-weight:700; color:var(--text); margin-bottom:12px; text-align:center; }
  .cook-instruction { font-size:16px; line-height:1.6; color:var(--text); margin-bottom:24px; }
  .cook-nav { display:flex; gap:12px; }
  .cook-nav .btn { flex:1; padding:16px; font-size:15px; }

  .fridge-row { display:flex; align-items:center; justify-content:space-between; padding:10px 4px; border-bottom:1px solid rgba(255,255,255,0.05); }
  .fridge-name { font-size:14.5px; color:var(--text); }
  .fridge-controls { display:flex; align-items:center; gap:10px; }
  .stepper-btn { width:30px; height:30px; border-radius:8px; background:var(--tile-hi); border:1px solid var(--border); color:var(--text); font-size:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .stepper-btn:hover { background:var(--accent); color:rgb(20,24,40); border-color:var(--accent); }
  .fridge-qty { min-width:44px; text-align:center; font-size:14.5px; color:var(--text); }
  .remove-btn { width:26px; height:26px; border-radius:50%; background:transparent; border:1px solid var(--border); color:var(--muted); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-left:4px; }
  .remove-btn:hover { background:var(--red); color:white; border-color:var(--red); }
  .add-row { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .add-row select, .add-row input { background:var(--tile-hi); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 10px; font-size:13.5px; }
  .add-row select { flex:2; min-width:140px; }
  .add-row input { flex:1; min-width:70px; }
  .add-row button { flex:0 0 auto; }

  .loading { color:var(--muted); text-align:center; padding:60px 0; }
  .hint { color:rgb(120,125,145); font-size:11px; text-align:center; max-width:480px; margin:14px auto 0; }
</style>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// =====================================================
// i18n
// =====================================================
const STRINGS = {
  de: {
    appTitle: "MEAL PLANNER",
    recipes: "Rezepte",
    inFridge: "Im Kühlschrank",
    toBuy: "Einzukaufen",
    readyToCook: "Kochbereit",
    whatCanICook: "Was kann ich kochen?",
    whatCanICookHint: "Zeile antippen zum Öffnen, Häkchen für die Einkaufsliste",
    missingLabel: "fehlt",
    shoppingListOpen: "Einkaufsliste — offen",
    shoppingListEmpty: "Rezepte auswählen, um die Einkaufsliste zu füllen.",
    selectedRecipes: "Ausgewählte Rezepte",
    noSelectionYet: "Noch keine Auswahl.",
    resetSelection: "Auswahl zurücksetzen",
    fridgeBtn: "Kühlschrank",
    fullscreen: "Vollbild",
    back: "‹ Zurück",
    backToRecipe: "‹ Rezept",
    servings: "Portionen",
    ingredients: "Zutaten",
    startCooking: "Kochen starten →",
    noStepsYet: "Für dieses Rezept sind noch keine Zubereitungsschritte hinterlegt.",
    stepOf: (a, b) => `Schritt ${a} von ${b}`,
    navBack: "← Zurück",
    next: "Weiter →",
    done: "Fertig ✓",
    fridgeTitle: "Kühlschrank",
    fridgeEmpty: "Noch nichts im Kühlschrank hinterlegt.",
    chooseIngredient: "Zutat wählen…",
    add: "Hinzufügen",
    fridgeSyncHint: "Änderungen werden live mit allen Geräten synchronisiert, die diese Seite geöffnet haben.",
    allRecipes: "Alle Rezepte",
    readyOnly: "Nur Kochbereite",
    showAll: "Alle anzeigen",
    noReadyRecipes: "Aktuell ist kein Rezept kochbereit.",
    loading: "Wird geladen…",
  },
  en: {
    appTitle: "MEAL PLANNER",
    recipes: "Recipes",
    inFridge: "In the Fridge",
    toBuy: "To Buy",
    readyToCook: "Ready to Cook",
    whatCanICook: "What can I cook?",
    whatCanICookHint: "Tap a row to open, checkmark for the shopping list",
    missingLabel: "missing",
    shoppingListOpen: "Shopping List — Open",
    shoppingListEmpty: "Select recipes to fill the shopping list.",
    selectedRecipes: "Selected Recipes",
    noSelectionYet: "Nothing selected yet.",
    resetSelection: "Reset Selection",
    fridgeBtn: "Fridge",
    fullscreen: "Fullscreen",
    back: "‹ Back",
    backToRecipe: "‹ Recipe",
    servings: "servings",
    ingredients: "Ingredients",
    startCooking: "Start Cooking →",
    noStepsYet: "No cooking steps have been added for this recipe yet.",
    stepOf: (a, b) => `Step ${a} of ${b}`,
    navBack: "← Back",
    next: "Next →",
    done: "Done ✓",
    fridgeTitle: "Fridge",
    fridgeEmpty: "Nothing in the fridge yet.",
    chooseIngredient: "Choose ingredient…",
    add: "Add",
    fridgeSyncHint: "Changes sync live with every device that has this page open.",
    allRecipes: "All Recipes",
    readyOnly: "Ready to Cook Only",
    showAll: "Show All",
    noReadyRecipes: "Nothing is ready to cook right now.",
    loading: "Loading…",
  },
};

function t(lang, key, ...args) {
  const dict = STRINGS[lang] || STRINGS.de;
  const val = dict[key] !== undefined ? dict[key] : STRINGS.de[key];
  return typeof val === "function" ? val(...args) : val;
}

function localName(item, lang) {
  if (!item) return "?";
  return item["name_" + lang] || item.name_de || item.name_en || "?";
}

function localField(item, field, lang) {
  if (!item) return "";
  return item[field + "_" + lang] || item[field + "_de"] || item[field + "_en"] || "";
}

const LANG_STORAGE_KEY = "mealPlannerLang";
function loadLang() {
  try {
    return localStorage.getItem(LANG_STORAGE_KEY) || "de";
  } catch (err) {
    return "de";
  }
}

function LangToggle({ lang, setLang }) {
  const other = lang === "de" ? "en" : "de";
  const flag = other === "de" ? "🇩🇪" : "🇬🇧";
  return (
    <span className="lang-toggle" onClick={() => setLang(other)} title={other === "de" ? "Deutsch" : "English"}>
      {flag}
    </span>
  );
}

// =====================================================
// Shared state (Firebase) - fridge is keyed by ingredient
// ID, never by name text. This is deliberate: matching by
// name broke as soon as a name had a plural ("Eggs" vs the
// old fridge key "egg"), and would break constantly once
// names change per language. IDs are stable in both cases.
// =====================================================
const DEFAULT_FRIDGE = { 64: 1, 21: 5, 65: 2, 27: 4, 6: 3, 7: 1000 };

function useSharedFridge() {
  const [fridge, setFridgeLocal] = React.useState(null); // null = still loading

  React.useEffect(() => {
    const ref = db.ref("mealPlanner/fridgeById");

    ref.once("value", snap => {
      if (snap.val() === null) ref.set(DEFAULT_FRIDGE);
    });

    const handler = snap => setFridgeLocal(snap.val() || {});
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  const setFridge = (updaterOrValue) => {
    setFridgeLocal(prevLocal => {
      const base = prevLocal || {};
      const next = typeof updaterOrValue === "function" ? updaterOrValue(base) : updaterOrValue;
      db.ref("mealPlanner/fridgeById").set(next);
      return next;
    });
  };

  return [fridge, setFridge];
}

function useSharedSelected() {
  const [selected, setSelectedLocal] = React.useState(null); // null = still loading

  React.useEffect(() => {
    const ref = db.ref("mealPlanner/selected");
    const handler = snap => setSelectedLocal(new Set(snap.val() || []));
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  const setSelected = (updaterOrValue) => {
    setSelectedLocal(prevLocal => {
      const base = prevLocal || new Set();
      const next = typeof updaterOrValue === "function" ? updaterOrValue(base) : updaterOrValue;
      db.ref("mealPlanner/selected").set(Array.from(next));
      return next;
    });
  };

  return [selected, setSelected];
}

// Same intent as modFridgeCheck.bas - now matching by ingredient ID
function computeStatus(recipe, recipeIngredients, ingredientsById, fridge) {
  const items = recipeIngredients.filter(ri => ri.recipeId === recipe.id);
  let criticalMissing = 0;
  const missing = [];

  for (const ri of items) {
    const ing = ingredientsById[ri.ingredientId];
    if (!ing) continue;
    const have = fridge[ri.ingredientId] || 0;
    if (have < ri.qty) {
      missing.push({ ing, short: ri.qty - have, unit: ri.unit });
      if (ing.critical) criticalMissing++;
    }
  }

  let level = criticalMissing === 0 ? "green" : criticalMissing <= 2 ? "amber" : "red";
  return { level, missing, items };
}

function useData() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    Promise.all([
      fetch("data/recipes.json").then(r => r.json()),
      fetch("data/ingredients.json").then(r => r.json()),
      fetch("data/recipe_ingredients.json").then(r => r.json()),
      fetch("data/recipe_steps.json").then(r => r.json()),
    ])
      .then(([recipes, ingredients, recipeIngredients, recipeSteps]) => {
        const ingredientsById = {};
        ingredients.forEach(i => { ingredientsById[i.id] = i; });
        setData({ recipes, ingredients, ingredientsById, recipeIngredients, recipeSteps });
      })
      .catch(err => setError(err.message));
  }, []);

  return { data, error };
}

function App() {
  const { data, error } = useData();
  const [view, setView] = useState("dashboard"); // dashboard | recipe | cook | fridge | recipes
  const [activeRecipeId, setActiveRecipeId] = useState(null);
  const [cookStep, setCookStep] = useState(0);
  const [selected, setSelected] = useSharedSelected();
  const [fridge, setFridge] = useSharedFridge();
  const [lang, setLangState] = useState(loadLang);
  const [recipesFilter, setRecipesFilter] = useState("all"); // all | ready

  const setLang = (l) => {
    setLangState(l);
    try { localStorage.setItem(LANG_STORAGE_KEY, l); } catch (err) {}
  };

  if (error) {
    return (
      <div className="screen">
        <p style={{ color: "var(--red)" }}>
          Could not load data ({error}). If you're opening this file directly instead of through
          a hosted URL, that's why — fetch() needs http(s), not file://. This works once pushed to
          GitHub Pages.
        </p>
      </div>
    );
  }

  if (!data || fridge === null || selected === null) {
    return <div className="screen"><div className="loading">{t(lang, "loading")}</div></div>;
  }

  const openRecipe = (id) => { setActiveRecipeId(id); setView("recipe"); };
  const startCooking = (id) => { setActiveRecipeId(id); setCookStep(0); setView("cook"); };
  const goHome = () => setView("dashboard");

  if (view === "recipe") {
    return (
      <RecipeDetail
        data={data}
        recipeId={activeRecipeId}
        onBack={goHome}
        onCook={() => startCooking(activeRecipeId)}
        onGoHome={goHome}
        lang={lang}
        setLang={setLang}
      />
    );
  }

  if (view === "cook") {
    return (
      <CookMode
        data={data}
        recipeId={activeRecipeId}
        step={cookStep}
        setStep={setCookStep}
        onExit={() => setView("recipe")}
        onGoHome={goHome}
        lang={lang}
        setLang={setLang}
      />
    );
  }

  if (view === "fridge") {
    return (
      <FridgeScreen
        data={data}
        fridge={fridge}
        setFridge={setFridge}
        onBack={goHome}
        onGoHome={goHome}
        lang={lang}
        setLang={setLang}
      />
    );
  }

  if (view === "recipes") {
    return (
      <RecipesPage
        data={data}
        fridge={fridge}
        selected={selected}
        setSelected={setSelected}
        onOpenRecipe={openRecipe}
        onBack={goHome}
        onGoHome={goHome}
        lang={lang}
        setLang={setLang}
        filter={recipesFilter}
        setFilter={setRecipesFilter}
      />
    );
  }

  return (
    <Dashboard
      data={data}
      fridge={fridge}
      selected={selected}
      setSelected={setSelected}
      onOpenRecipe={openRecipe}
      onOpenFridge={() => setView("fridge")}
      onOpenRecipesList={() => { setRecipesFilter("all"); setView("recipes"); }}
      onOpenReadyToCook={() => { setRecipesFilter("ready"); setView("recipes"); }}
      lang={lang}
      setLang={setLang}
    />
  );
}

function Dashboard({ data, fridge, selected, setSelected, onOpenRecipe, onOpenFridge, onOpenRecipesList, onOpenReadyToCook, lang, setLang }) {
  const { recipes, recipeIngredients, ingredientsById } = data;

  const statuses = useMemo(() => {
    const map = {};
    for (const r of recipes) map[r.id] = computeStatus(r, recipeIngredients, ingredientsById, fridge);
    return map;
  }, [recipes, recipeIngredients, ingredientsById, fridge]);

  const nCook = Object.values(statuses).filter(s => s.level === "green").length;
  const nFridgeItems = Object.values(fridge).filter(q => q > 0).length;

  const shoppingList = useMemo(() => {
    const totals = {};
    for (const r of recipes) {
      if (!selected.has(r.id)) continue;
      for (const item of statuses[r.id].missing) {
        const key = item.ing.id + "|" + item.unit;
        if (!totals[key]) totals[key] = { ing: item.ing, unit: item.unit, qty: 0 };
        totals[key].qty += item.short;
      }
    }
    return Object.values(totals);
  }, [selected, statuses, recipes]);

  const toggleRecipe = (id) => {
    setSelected(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  const now = new Date();
  const stamp = now.toLocaleDateString(lang === "de" ? "de-DE" : "en-GB") + " " + now.toLocaleTimeString(lang === "de" ? "de-DE" : "en-GB", { hour: "2-digit", minute: "2-digit" });

  return (
    <div className="screen">
      <div className="header">
        <h1 onClick={() => {}}>{t(lang, "appTitle")}</h1>
        <div className="header-right">
          <div style={{ color: "var(--muted)", fontSize: 11 }}>{stamp}</div>
          <LangToggle lang={lang} setLang={setLang} />
        </div>
      </div>

      <div className="kpi-row">
        <Kpi label={t(lang, "recipes")} value={recipes.length} onClick={onOpenRecipesList} />
        <Kpi label={t(lang, "inFridge")} value={nFridgeItems} onClick={onOpenFridge} />
        <Kpi label={t(lang, "toBuy")} value={shoppingList.length} tone={shoppingList.length > 0 ? "warn" : "good"} />
        <Kpi label={t(lang, "readyToCook")} value={nCook} tone={nCook > 0 ? "good" : "warn"} onClick={onOpenReadyToCook} />
      </div>

      <div className="main-row">
        <div className="tile">
          <div className="tile-hdr">{t(lang, "whatCanICook")} — {t(lang, "whatCanICookHint")}</div>
          {recipes.map(r => {
            const s = statuses[r.id];
            const isSel = selected.has(r.id);
            return (
              <div key={r.id} className={"sugg-line" + (isSel ? " selected" : "")} onClick={() => onOpenRecipe(r.id)}>
                <span className="check" onClick={(e) => { e.stopPropagation(); toggleRecipe(r.id); }}>✓</span>
                <span className={"dot " + s.level}></span>
                <span>
                  <span className="recipe-title">{localName(r, lang)}</span>
                  {s.missing.length > 0 && (
                    <span className="sugg-missing">
                      {` — ${t(lang, "missingLabel")}: `}
                      {s.missing.map(m => `${localName(m.ing, lang)} (${m.short}${m.unit === "pcs" ? "" : " " + m.unit})`).join(", ")}
                    </span>
                  )}
                </span>
              </div>
            );
          })}
        </div>

        <div className="right-col">
          <div className="tile">
            <div className="tile-hdr">{t(lang, "shoppingListOpen")}</div>
            {shoppingList.length === 0 ? (
              <div className="empty-msg">{t(lang, "shoppingListEmpty")}</div>
            ) : (
              shoppingList.map(item => (
                <div className="shop-item" key={item.ing.id + item.unit}>
                  <span>{localName(item.ing, lang)}</span>
                  <span className="qty">{item.qty}{item.unit === "pcs" ? "" : " " + item.unit}</span>
                </div>
              ))
            )}
          </div>
          <div className="tile">
            <div className="tile-hdr">{t(lang, "selectedRecipes")}</div>
            {selected.size === 0 ? (
              <div className="empty-msg">{t(lang, "noSelectionYet")}</div>
            ) : (
              recipes.filter(r => selected.has(r.id)).map(r => (
                <div key={r.id} style={{ fontSize: 13.5, color: "var(--text)", padding: "4px 0" }}>{localName(r, lang)}</div>
              ))
            )}
          </div>
        </div>
      </div>

      <div className="btn-row">
        <button className="btn primary" onClick={() => setSelected(new Set())}>{t(lang, "resetSelection")}</button>
        <button className="btn" onClick={onOpenFridge}>{t(lang, "fridgeBtn")}</button>
        <button className="btn" onClick={() => document.documentElement.requestFullscreen?.()}>{t(lang, "fullscreen")}</button>
      </div>
    </div>
  );
}

// Dedicated full-page recipe browser — every recipe in the database,
// with photo, status, and the same add-to-shopping-list checkbox as
// the Home Screen tile, just roomier and easier to scroll through.
function RecipesPage({ data, fridge, selected, setSelected, onOpenRecipe, onBack, onGoHome, lang, setLang, filter, setFilter }) {
  const { recipes, recipeIngredients, ingredientsById } = data;

  const statuses = useMemo(() => {
    const map = {};
    for (const r of recipes) map[r.id] = computeStatus(r, recipeIngredients, ingredientsById, fridge);
    return map;
  }, [recipes, recipeIngredients, ingredientsById, fridge]);

  const visibleRecipes = filter === "ready" ? recipes.filter(r => statuses[r.id].level === "green") : recipes;

  const toggleRecipe = (id) => {
    setSelected(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  return (
    <div className="screen">
      <div className="header">
        <h1 onClick={onGoHome}>{t(lang, "appTitle")}</h1>
        <div className="header-right">
          <LangToggle lang={lang} setLang={setLang} />
          <span className="back" onClick={onBack}>{t(lang, "back")}</span>
        </div>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 16 }}>
        <h2 style={{ color: "var(--text)", margin: 0 }}>
          {filter === "ready" ? t(lang, "readyOnly") : t(lang, "allRecipes")}
        </h2>
        <span className="back" onClick={() => setFilter(filter === "ready" ? "all" : "ready")}>
          {filter === "ready" ? t(lang, "showAll") : t(lang, "readyOnly")}
        </span>
      </div>

      {visibleRecipes.length === 0 && (
        <div className="empty-msg">{t(lang, "noReadyRecipes")}</div>
      )}

      {visibleRecipes.map(r => {
        const s = statuses[r.id];
        const isSel = selected.has(r.id);
        return (
          <div key={r.id} className="recipe-card" onClick={() => onOpenRecipe(r.id)}>
            {r.heroImage && <img className="recipe-card-img" src={r.heroImage} alt={localName(r, lang)} />}
            <div className="recipe-card-body">
              <div className="recipe-card-top">
                <span className="recipe-card-title">{localName(r, lang)}</span>
                <span
                  className={"check" + (isSel ? " checked" : "")}
                  onClick={(e) => { e.stopPropagation(); toggleRecipe(r.id); }}
                  title={t(lang, "toBuy")}
                >✓</span>
              </div>
              <div className="recipe-card-meta">
                <span className={"dot " + s.level}></span>
                {r.servings} {t(lang, "servings")}
                {r.durationMinutes && ` · ${r.durationMinutes} min`}
                {r.kcal && ` · ${r.kcal} kcal`}
              </div>
              {s.missing.length > 0 && (
                <div className="sugg-missing" style={{ marginTop: 4 }}>
                  {t(lang, "missingLabel")}: {s.missing.map(m => `${localName(m.ing, lang)} (${m.short}${m.unit === "pcs" ? "" : " " + m.unit})`).join(", ")}
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function FridgeScreen({ data, fridge, setFridge, onBack, onGoHome, lang, setLang }) {
  const [addId, setAddId] = useState("");
  const [addQty, setAddQty] = useState("1");

  const entries = Object.entries(fridge)
    .map(([id, qty]) => ({ id, qty, ing: data.ingredientsById[id] }))
    .filter(e => e.ing)
    .sort((a, b) => localName(a.ing, lang).localeCompare(localName(b.ing, lang)));

  const adjust = (id, delta) => {
    setFridge(prev => ({ ...prev, [id]: Math.max(0, (prev[id] || 0) + delta) }));
  };

  const remove = (id) => {
    setFridge(prev => {
      const next = { ...prev };
      delete next[id];
      return next;
    });
  };

  const availableToAdd = data.ingredients
    .filter(ing => !(String(ing.id) in fridge))
    .sort((a, b) => localName(a, lang).localeCompare(localName(b, lang)));

  const handleAdd = () => {
    if (!addId) return;
    const qty = parseFloat(addQty);
    setFridge(prev => ({ ...prev, [addId]: isNaN(qty) ? 0 : qty }));
    setAddId("");
    setAddQty("1");
  };

  return (
    <div className="screen">
      <div className="header">
        <h1 onClick={onGoHome}>{t(lang, "appTitle")}</h1>
        <div className="header-right">
          <LangToggle lang={lang} setLang={setLang} />
          <span className="back" onClick={onBack}>{t(lang, "back")}</span>
        </div>
      </div>

      <h2 style={{ color: "var(--text)", marginTop: 0 }}>{t(lang, "fridgeTitle")}</h2>

      {entries.length === 0 ? (
        <div className="empty-msg">{t(lang, "fridgeEmpty")}</div>
      ) : (
        entries.map(e => (
          <div className="fridge-row" key={e.id}>
            <span className="fridge-name">{localName(e.ing, lang)}</span>
            <div className="fridge-controls">
              <button className="stepper-btn" onClick={() => adjust(e.id, -1)}>−</button>
              <span className="fridge-qty">{e.qty}</span>
              <button className="stepper-btn" onClick={() => adjust(e.id, 1)}>+</button>
              <button className="remove-btn" onClick={() => remove(e.id)} title="✕">✕</button>
            </div>
          </div>
        ))
      )}

      <div className="add-row">
        <select value={addId} onChange={ev => setAddId(ev.target.value)}>
          <option value="">{t(lang, "chooseIngredient")}</option>
          {availableToAdd.map(ing => (
            <option key={ing.id} value={ing.id}>{localName(ing, lang)}</option>
          ))}
        </select>
        <input type="number" min="0" step="any" value={addQty} onChange={ev => setAddQty(ev.target.value)} />
        <button className="btn primary" onClick={handleAdd} disabled={!addId}>{t(lang, "add")}</button>
      </div>

      <p className="hint" style={{ marginTop: 20 }}>{t(lang, "fridgeSyncHint")}</p>
    </div>
  );
}

function RecipeDetail({ data, recipeId, onBack, onCook, onGoHome, lang, setLang }) {
  const { recipes, recipeIngredients, ingredientsById } = data;
  const recipe = recipes.find(r => r.id === recipeId);
  const items = recipeIngredients.filter(ri => ri.recipeId === recipeId);
  const hasSteps = data.recipeSteps.some(s => s.recipeId === recipeId);

  return (
    <div className="screen">
      <div className="header">
        <h1 onClick={onGoHome}>{t(lang, "appTitle")}</h1>
        <div className="header-right">
          <LangToggle lang={lang} setLang={setLang} />
          <span className="back" onClick={onBack}>{t(lang, "back")}</span>
        </div>
      </div>

      {recipe.heroImage && <img className="hero-img" src={recipe.heroImage} alt={localName(recipe, lang)} />}

      <h2 style={{ color: "var(--text)", marginTop: 0 }}>{localName(recipe, lang)}</h2>
      <div className="recipe-meta">
        {recipe.servings} {t(lang, "servings")}
        {recipe.durationMinutes && ` · ${recipe.durationMinutes} min`}
        {recipe.kcal && ` · ${recipe.kcal} kcal`}
      </div>

      <div className="tile-hdr">{t(lang, "ingredients")}</div>
      <ul className="ing-list">
        {items.map(ri => {
          const ing = ingredientsById[ri.ingredientId];
          return (
            <li key={ri.id}>
              <span>{localName(ing, lang)}</span>
              <span className="qty">{ri.qty}{ri.unit === "pcs" ? "" : " " + ri.unit}</span>
            </li>
          );
        })}
      </ul>

      {hasSteps ? (
        <button className="btn primary" style={{ width: "100%", padding: 16 }} onClick={onCook}>
          {t(lang, "startCooking")}
        </button>
      ) : (
        <div className="empty-msg">{t(lang, "noStepsYet")}</div>
      )}
    </div>
  );
}

function CookMode({ data, recipeId, step, setStep, onExit, onGoHome, lang, setLang }) {
  const steps = data.recipeSteps.filter(s => s.recipeId === recipeId).sort((a, b) => a.stepNumber - b.stepNumber);
  const current = steps[step];

  if (!current) return null;

  const isLast = step === steps.length - 1;

  return (
    <div className="screen">
      <div className="header">
        <h1 onClick={onGoHome}>{t(lang, "appTitle")}</h1>
        <div className="header-right">
          <LangToggle lang={lang} setLang={setLang} />
          <span className="back" onClick={onExit}>{t(lang, "backToRecipe")}</span>
        </div>
      </div>

      <div className="cook-progress">{t(lang, "stepOf", step + 1, steps.length)}</div>

      {current.image && <img className="cook-step-img" src={current.image} alt={localField(current, "title", lang)} />}

      <div className="cook-title">{localField(current, "title", lang)}</div>
      <div className="cook-instruction">{localField(current, "instruction", lang)}</div>

      <div className="cook-nav">
        <button className="btn" disabled={step === 0} style={{ opacity: step === 0 ? 0.4 : 1 }}
                onClick={() => setStep(s => Math.max(0, s - 1))}>
          {t(lang, "navBack")}
        </button>
        <button className="btn primary"
                onClick={() => isLast ? onExit() : setStep(s => s + 1)}>
          {isLast ? t(lang, "done") : t(lang, "next")}
        </button>
      </div>
    </div>
  );
}

function Kpi({ label, value, tone, onClick }) {
  return (
    <div className="kpi" onClick={onClick}>
      <div className="kpi-label">{label}</div>
      <div className={"kpi-value" + (tone ? " " + tone : "")}>{value}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
